# 训练服务配置模板。复制为 training/config.yaml 后按环境修改；config.yaml 不入库。
# 推理/标注配置见 annotation/config.yaml。

server:
  host: "0.0.0.0"
  port: 21011
  log_level: info

# 训练默认 GPU（gpu_lock + Ultralytics）；与推理分卡时改为 "1"
device: "0"

# 训练进程可见 GPU；双卡训推分离示例："0,1"（推理见 annotation/config.yaml）
gpu:
  cuda_visible_devices: "0"

# Ultralytics 默认超参（平台 API 未传时使用；单次 JSON 可覆盖）
epochs: 100
batch: 16
imgsz: 640
exist_ok: true
save: true
amp: true
verbose: false
patience: 20
workers: 4
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
close_mosaic: 10
