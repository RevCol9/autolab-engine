# 闭环检测训练默认超参（Ultralytics 字段名）。
# 任务级 train_config.yaml 会覆盖此处默认值。

epochs: 50
batch: 4
imgsz: 640
device: "0"

# 闭环训练固定项
exist_ok: true
save: true
amp: false
verbose: false

# 可选调参（按需从 API extra 字段覆盖）
patience: 20
workers: 4
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
close_mosaic: 10
