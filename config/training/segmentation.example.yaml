# 分割训练 Ultralytics 默认超参。复制为 config/training/segmentation.yaml；不入库。

model: yolo11n-seg.pt
epochs: 100
batch: 8
imgsz: 640
exist_ok: true
save: true
amp: true
verbose: false
patience: 20
workers: 4
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
close_mosaic: 10
